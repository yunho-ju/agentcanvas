[project]
name = "agentcanvas-contracts"
version = "0.1.0a1"
description = "AgentCanvas core contracts (AgentSpec, RunEvent, NodeType, ReleaseManifest)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcanvas_contracts"]
