[project]
name = "agentcanvas-adapters"
version = "0.1.0a1"
description = "AgentCanvas adapters (실 모델 provider·서버 금고)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agentcanvas-contracts",
    "agentcanvas-engine",
    # 판단을 구조화 출력으로 조이는 `output_config`를 받는 판이어야 한다 — 이 아래 판에서는
    # 그 말이 TypeError가 되어 provider 오류가 아니라 실행 전체의 사고로 샌다.
    # (받는지는 test_anthropic_model.py가 실 클라이언트 시그니처로 확인한다.)
    "anthropic>=0.122",
    # 같은 이유로 `response_format` json_schema를 받는 판. base_url 주입이 1급이라
    # OpenAI 본사와 로컬 서빙(Ollama 등)을 같은 계약으로 부른다.
    "openai>=3.2",
    # 우리가 감싼 HTTP API를 실제로 부르는 자리(http_tool). 도구마다의 시간 제한을 요청에
    # 그대로 실을 수 있어야 한다 — 그것이 도구 계약의 timeout_ms를 처음으로 강제하는 자리다.
    "httpx>=0.27",
]

[project.optional-dependencies]
# 뜻으로 보는 판정(NLI) 층 — 서버에 골라 설치한다. 설치하지 않으면 함의를 묻는 자리가
# 비고(local_entailment가 없음을 돌려준다) 사다리는 0층까지만 선다. 호출당 비용은 0이다.
nli = ["torch>=2.2", "transformers>=4.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcanvas_adapters"]

[tool.uv.sources]
agentcanvas-contracts = { workspace = true }
agentcanvas-engine = { workspace = true }
