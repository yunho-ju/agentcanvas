[project]
name = "agentcanvas-api"
version = "0.1.0a1"
description = "AgentCanvas control plane API (AgentSpec 저장·판 이력)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agentcanvas-adapters",
    "agentcanvas-contracts",
    "agentcanvas-engine",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.scripts]
agentcanvas-ops = "agentcanvas_api.operations:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcanvas_api"]

[tool.uv.sources]
agentcanvas-adapters = { workspace = true }
agentcanvas-contracts = { workspace = true }
agentcanvas-engine = { workspace = true }
