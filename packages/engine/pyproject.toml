[project]
name = "agentcanvas-engine"
version = "0.1.0a1"
description = "AgentCanvas engine (graph static validation)"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["agentcanvas-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentcanvas_engine"]

[tool.uv.sources]
agentcanvas-contracts = { workspace = true }
