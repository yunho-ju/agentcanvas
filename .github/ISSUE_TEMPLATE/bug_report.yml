name: Bug report
description: Report a reproducible AgentCanvas defect
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AgentCanvas. Do not include secrets, real `.env` files, user databases, private prompts, or provider responses. Security issues must follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag or full commit SHA where the issue occurs.
      placeholder: v0.1.0-alpha.1 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose
        - Local Python and pnpm development
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, browser, Docker/Python/Node versions as relevant.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest deterministic sequence that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, personal data, prompt content, cookies, tokens, database paths, and provider payloads.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the README, roadmap, and existing issues.
          required: true
        - label: I removed secrets, private data, and provider content.
          required: true
        - label: This is not a security vulnerability.
          required: true
