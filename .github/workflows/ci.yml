name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run --frozen ruff check packages
      - run: uv run --frozen ruff format --check packages
      - run: uv run --frozen pytest

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
      - run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: VITE_API_URL=/api pnpm build
      - run: pnpm gen:types
      - run: git diff --exit-code -- apps/studio/src/generated

  containers:
    runs-on: ubuntu-latest
    needs: [python, studio]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build --target api-runtime --tag agentcanvas-api:ci .
      - name: Verify auth configuration fails closed
        run: |
          if docker run --rm agentcanvas-api:ci; then
            echo "API started without required auth credentials"
            exit 1
          fi
      - run: docker build --target studio-runtime --build-arg VITE_API_URL=/api --tag agentcanvas-studio:ci .
      - name: Smoke-test the isolated Compose stack
        env:
          AGENTCANVAS_PORT: "18080"
          AGENTCANVAS_ADMIN_PASSWORD: "ci-only-admin-password"
          AGENTCANVAS_SESSION_SECRET: "ci-only-session-secret-with-at-least-32-bytes"
        run: |
          set -euo pipefail
          cookie_jar="$(mktemp)"
          header_file="$(mktemp)"
          cleanup() {
            rm -f "$cookie_jar" "$header_file"
            docker compose -p agentcanvas-ci --env-file .env.example down --volumes --remove-orphans
          }
          trap cleanup EXIT
          docker compose -p agentcanvas-ci --env-file .env.example up --build --detach --wait --wait-timeout 180
          curl --fail --silent --show-error http://127.0.0.1:18080/ > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:18080/api/health/live
          curl --fail --silent --show-error http://127.0.0.1:18080/api/health/ready
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/api/specs)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{"password":"wrong-password"}' \
            http://127.0.0.1:18080/api/auth/login)" = "401"
          csrf="$(curl --fail --silent --show-error --cookie-jar "$cookie_jar" \
            --dump-header "$header_file" \
            --header 'Content-Type: application/json' \
            --data '{"password":"ci-only-admin-password"}' \
            http://127.0.0.1:18080/api/auth/login \
            | python -c 'import json, sys; print(json.load(sys.stdin)["csrf_token"])')"
          test -n "$csrf"
          grep --ignore-case --quiet 'httponly' "$header_file"
          grep --ignore-case --quiet 'samesite=strict' "$header_file"
          curl --fail --silent --show-error --cookie "$cookie_jar" \
            --dump-header "$header_file" \
            http://127.0.0.1:18080/api/auth/session > /dev/null
          grep --ignore-case --quiet '^cache-control: no-store' "$header_file"
          curl --fail --silent --show-error --cookie "$cookie_jar" \
            http://127.0.0.1:18080/api/specs
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie "$cookie_jar" --request POST \
            http://127.0.0.1:18080/api/auth/logout)" = "403"
          # Sessions are stateless HMAC: logout clears the cookie, it does not
          # revoke the token server-side. Update the jar so the cleared cookie
          # takes effect, matching the documented contract.
          curl --fail --silent --show-error --cookie "$cookie_jar" \
            --cookie-jar "$cookie_jar" \
            --header "X-CSRF-Token: $csrf" --request POST \
            http://127.0.0.1:18080/api/auth/logout > /dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --cookie "$cookie_jar" http://127.0.0.1:18080/api/specs)" = "401"
