[project]
name = "agentcanvas"
version = "0.1.0a1"
description = "AgentCanvas — visual agent control plane"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "agentcanvas-adapters",
    "agentcanvas-api",
    "agentcanvas-contracts",
    "agentcanvas-engine",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
agentcanvas-adapters = { workspace = true }
agentcanvas-api = { workspace = true }
agentcanvas-contracts = { workspace = true }
agentcanvas-engine = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.0", "jsonschema>=4.21", "ruff>=0.14", "httpx>=0.27"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "live: 실 열쇠로 진짜 provider를 부르는 확인 — 기본 수집 대상이 아니고, 사람이 파일을 이름으로 부를 때만 돈다",
]
testpaths = [
    "packages/contracts/tests",
    "packages/engine/tests",
    "packages/adapters/tests",
    "packages/api/tests",
]
